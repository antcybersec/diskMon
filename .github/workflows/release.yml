name: Build & Release diskMon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS Binary (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/resource-ui dist/diskMon
          cd dist && zip -r diskMon-macOS-universal.zip diskMon

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/diskMon-macOS-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Binary (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Binary
        run: |
          mkdir dist
          copy target\release\resource-ui.exe dist\diskMon.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/diskMon.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
