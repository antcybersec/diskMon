name: Build & Release diskMon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS app (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal .app and .dmg
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: diskMon-macos
          path: dist/diskMon-macos-universal.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows app (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release -p resource-ui

      - name: Package Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\resource-ui.exe dist\diskMon-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: diskMon-windows
          path: dist/diskMon-windows-x64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux app (.AppImage, .deb)
    # Oldest supported runner, so the binaries also run on older distros (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev xvfb libgl1-mesa-dri

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Run tests
        run: cargo test --workspace

      - name: Smoke test the CLI on Linux
        run: cargo run --release -p resource-cli

      - name: Build packages
        run: scripts/package-linux.sh

      - name: Launch the app under a virtual display
        run: |
          set +e
          timeout 15 xvfb-run -a target/release/resource-ui
          status=$?
          # 124 means it was still running when timeout stopped it, i.e. it started fine.
          if [ $status -ne 124 ]; then echo "app exited early with status $status"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: diskMon-linux
          path: |
            dist/diskMon-linux-x86_64.AppImage
            dist/diskMon-linux-amd64.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/diskMon-macos-universal.dmg
            dist/diskMon-windows-x64.exe
            dist/diskMon-linux-x86_64.AppImage
            dist/diskMon-linux-amd64.deb
          generate_release_notes: true
