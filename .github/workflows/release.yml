name: Build & Release diskMon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS app (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal .app and .dmg
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: diskMon-macos
          path: dist/diskMon-macos-universal.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows app (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release -p resource-ui

      - name: Package Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\resource-ui.exe dist\diskMon-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: diskMon-windows
          path: dist/diskMon-windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/diskMon-macos-universal.dmg
            dist/diskMon-windows-x64.exe
          generate_release_notes: true
