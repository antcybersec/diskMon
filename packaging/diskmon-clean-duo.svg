<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Dock drop shadow -->
    <filter id="dock-shadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Baseplate dark obsidian gradient -->
    <linearGradient id="base-plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#262422"/>
      <stop offset="50%" stop-color="#161514"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </linearGradient>

    <!-- Specular outer rim highlight -->
    <linearGradient id="rim-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Amber Treemap Block Gradient -->
    <linearGradient id="amber-block-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="60%" stop-color="#f08a3c"/>
      <stop offset="100%" stop-color="#d46115"/>
    </linearGradient>

    <!-- Deep Titanium Slate Block Gradient -->
    <linearGradient id="titanium-block-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36332e"/>
      <stop offset="100%" stop-color="#1f1e1a"/>
    </linearGradient>

    <!-- Amber Glow Filter -->
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f08a3c" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Slate Block Shadow -->
    <filter id="slate-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <clipPath id="squircle">
      <rect x="36" y="36" width="440" height="440" rx="98" ry="98"/>
    </clipPath>
  </defs>

  <!-- macOS Squircle Body -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="url(#base-plate)" filter="url(#dock-shadow)"/>
  
  <!-- Outer Chamfer Highlight -->
  <rect x="37" y="37" width="438" height="438" rx="97" ry="97" fill="none" stroke="url(#rim-specular)" stroke-width="2"/>

  <!-- Content -->
  <g clip-path="url(#squircle)">
    <!-- Top Diffuse Overhead Light -->
    <radialGradient id="light-cast" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <rect x="36" y="36" width="440" height="440" fill="url(#light-cast)"/>

    <!-- ==================== THE ONE ICONIC FORM: INTERLOCKING DUO ==================== -->
    <g transform="translate(116, 116)">
      <!-- Block 1: Deep Titanium Monolith (The System Baseline) -->
      <g filter="url(#slate-shadow)">
        <rect x="0" y="0" width="168" height="280" rx="24" fill="url(#titanium-block-grad)" stroke="#4a463f" stroke-width="2"/>
        <!-- Beveled Top Reflection -->
        <rect x="2" y="2" width="164" height="60" rx="22" fill="#ffffff" opacity="0.04"/>
      </g>

      <!-- Block 2: Radiant Amber Block (The Active Memory Pulse) -->
      <g filter="url(#amber-glow)">
        <rect x="184" y="0" width="96" height="172" rx="22" fill="url(#amber-block-grad)" stroke="#ffd280" stroke-width="2"/>
        <!-- Specular Highlight Curve -->
        <path d="M 186 22 C 186 10, 194 4, 206 4 L 258 4 C 270 4, 278 10, 278 22 L 278 50 C 230 45, 200 65, 186 95 Z" fill="#ffffff" opacity="0.25"/>
      </g>

      <!-- Minimalist Accent: Diagnostic Free Space Dot -->
      <circle cx="232" cy="228" r="8" fill="#4a463f"/>
    </g>
    <!-- ============================================================================== -->
  </g>
</svg>
